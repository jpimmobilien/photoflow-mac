name: UI review screenshots

on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Resources/**', 'Packaging/**', 'Scripts/**', '.github/workflows/ui.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: ui-review
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Build (arm64 only, fast)
        run: |
          chmod +x Scripts/*.sh
          ARCHS=arm64 NO_DMG=1 ./Scripts/build_app.sh 2>&1 | tee build.log

      - name: Cache test photos
        uses: actions/cache@v4
        with:
          path: /tmp/tour-photos
          key: tour-photos-v1

      - name: Download test photos
        run: |
          set +e
          mkdir -p /tmp/tour-photos
          if [ "$(ls /tmp/tour-photos | wc -l)" -lt 20 ]; then
            for i in 01 03 05 07 12 13 14 15 17 20 21 22 23 24; do
              curl -sfL --max-time 30 -o /tmp/tour-photos/kodim$i.png "https://r0k.us/graphics/kodak/kodak/kodim$i.png"
            done
            for id in 10 11 13 15 16 17 28 29 33 37 39 42 48 54 57 64 76 82 91 96 101 103 1015 1018 1036 1043 1050 1069; do
              curl -sfL --max-time 30 -o /tmp/tour-photos/photo-$id.jpg "https://picsum.photos/id/$id/2400/1600"
            done
            # a few duplicates for the Duplicate Finder screens
            cp /tmp/tour-photos/photo-10.jpg "/tmp/tour-photos/photo-10 copy.jpg"
            cp /tmp/tour-photos/photo-28.jpg "/tmp/tour-photos/photo-28 Kopie.jpg"
            sips -Z 1200 /tmp/tour-photos/photo-42.jpg --out /tmp/tour-photos/photo-42-small.jpg >/dev/null
          fi
          find /tmp/tour-photos -size -10k -delete
          ls /tmp/tour-photos | wc -l

      - name: UI tour (light, dark, German)
        run: |
          set +e
          APP=build/PhotoFlow.app/Contents/MacOS/PhotoFlow
          mkdir -p /tmp/shots
          run_tour() {
            rm -rf /tmp/tourlib
            PHOTOFLOW_LIBRARY_DIR=/tmp/tourlib PHOTOFLOW_TOUR_PHOTOS=/tmp/tour-photos "$APP" --ui-tour /tmp/shots "$@" > /tmp/tour.log 2>&1
            grep UITOUR /tmp/tour.log; cat /tmp/tour.log >> /tmp/tour-all.log
          }
          run_tour -appearance light -AppleLanguages '(en)'
          run_tour -appearance dark -AppleLanguages '(en)'
          run_tour -appearance light -AppleLanguages '(de)'
          ls -la /tmp/shots | head -100

      - name: Publish screenshots (shots branch)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p /tmp/pub; cp /tmp/shots/*.png /tmp/pub/ 2>/dev/null; cp build.log /tmp/tour.log /tmp/pub/ 2>/dev/null
          cd /tmp/pub
          # downscale to keep the branch small (1440 pt windows at 2x → 1440 px wide)
          for f in *.png; do sips -Z 1600 "$f" >/dev/null 2>&1; done
          git init -q -b shots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "UI screenshots ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" shots
