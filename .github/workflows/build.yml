name: Build PhotoFlow

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner image (macos-15 = Apple Silicon, macos-15-intel = Intel fallback when arm64 capacity is short)'
        default: macos-15
  push:
    tags: ['v*']

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -z "$XC" ] && XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          swift --version
          xcrun --show-sdk-version

      - name: Build universal app + DMG
        run: |
          chmod +x Scripts/*.sh
          ./Scripts/build_app.sh 2>&1 | tee build.log

      - name: Verify architectures
        run: |
          lipo -archs build/PhotoFlow.app/Contents/MacOS/PhotoFlow
          file build/PhotoFlow.app/Contents/MacOS/PhotoFlow
          codesign -dv build/PhotoFlow.app 2>&1 | head -5

      - name: Verify new app icon in app and DMG
        run: |
          set -euo pipefail
          want=$(shasum -a 256 Packaging/AppIcon.icns | cut -d' ' -f1)
          inapp=$(shasum -a 256 build/PhotoFlow.app/Contents/Resources/AppIcon.icns | cut -d' ' -f1)
          mnt=$(mktemp -d); hdiutil attach -nobrowse -readonly -mountpoint "$mnt" build/PhotoFlow.dmg >/dev/null
          indmg=$(shasum -a 256 "$mnt/PhotoFlow.app/Contents/Resources/AppIcon.icns" | cut -d' ' -f1)
          plist=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$mnt/PhotoFlow.app/Contents/Info.plist")
          test -f "$mnt/PhotoFlow.app/Contents/Resources/BrandMark.png"
          sips -s format png "$mnt/PhotoFlow.app/Contents/Resources/AppIcon.icns" --out icon-from-dmg.png >/dev/null
          hdiutil detach "$mnt" >/dev/null || hdiutil detach -force "$mnt"
          echo "source $want | app $inapp | dmg $indmg | CFBundleIconFile=$plist" | tee icon-check.log
          test "$want" = "$inapp" && test "$want" = "$indmg" && test "$plist" = "AppIcon"
          echo "✓ new icon verified in PhotoFlow.app and PhotoFlow.dmg" | tee -a icon-check.log

      - name: Self-test (native slice of this runner)
        run: |
          A=$(uname -m); [ "$A" = "x86_64" ] && N=x86_64 || N=arm64
          build/PhotoFlow.app/Contents/MacOS/PhotoFlow --qa selftest 2>&1 | tee selftest-$N.log

      - name: Self-test (x86_64 slice via Rosetta)
        if: runner.arch == 'ARM64'
        run: |
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true
          arch -x86_64 build/PhotoFlow.app/Contents/MacOS/PhotoFlow --qa info 2>&1 | tee selftest-x86_64.log
          arch -x86_64 build/PhotoFlow.app/Contents/MacOS/PhotoFlow --qa selftest 2>&1 | tee -a selftest-x86_64.log

      - name: Download real test photos
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/seeds
          # Kodak Lossless True Color Image Suite (24 classic reference photographs)
          for i in $(seq -w 1 24); do
            curl -sfL --max-time 30 -o /tmp/seeds/kodim$i.png "https://r0k.us/graphics/kodak/kodak/kodim$i.png"
          done
          # Unsplash photos via picsum.photos (fixed ids → reproducible), 2400 px
          for id in 10 11 13 15 16 17 18 19 20 22 24 28 29 33 37 39 42 48 49 54 57 58 64 65 76 82 91 96 101 103; do
            curl -sfL --max-time 30 -o /tmp/seeds/picsum$id.jpg "https://picsum.photos/id/$id/2400/1600"
          done
          find /tmp/seeds -size -10k -delete
          echo "seed photos: $(ls /tmp/seeds | wc -l)"

      - name: QA on generated dataset
        continue-on-error: true
        run: |
          set +e
          APP=build/PhotoFlow.app/Contents/MacOS/PhotoFlow
          $APP --qa info | tee qa.log
          echo "seed photos: $(ls /tmp/seeds | wc -l)" | tee -a qa.log
          $APP --qa gen /tmp/seeds /tmp/pf 60 | tee -a qa.log
          for k in dup tilt wb persp; do echo "$k files: $(ls /tmp/pf/$k | wc -l)" | tee -a qa.log; done
          $APP --qa eval-dup /tmp/pf/dup 2>&1 | tee -a qa.log
          $APP --qa eval-straighten /tmp/pf/tilt 2>&1 | tee -a qa.log
          $APP --qa eval-wb /tmp/pf/wb 2>&1 | tee -a qa.log
          $APP --qa eval-perspective /tmp/pf/persp 2>&1 | tee -a qa.log
          $APP --qa batch /tmp/seeds 100 2>&1 | tee -a qa.log
          $APP --qa batch /tmp/seeds 500 2>&1 | tee -a qa.log
          $APP --qa batch /tmp/seeds 1000 2>&1 | tee -a qa.log
          arch -x86_64 $APP --qa batch /tmp/seeds 100 2>&1 | sed 's/^/[x86_64] /' | tee -a qa.log

      - name: Upload DMG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhotoFlow-dmg
          path: build/PhotoFlow.dmg
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            selftest-*.log
            qa.log
          if-no-files-found: warn

      - name: Publish DMG (GitHub release + dist branch)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cat > notes.md <<NOTES
          PhotoFlow – automatischer Build ${{ github.run_number }} (Commit ${GITHUB_SHA::7})

          - Universal Binary: $(lipo -archs build/PhotoFlow.app/Contents/MacOS/PhotoFlow)
          - Ad-hoc signiert, nicht notarisiert → erster Start: Rechtsklick ▸ Öffnen ▸ Öffnen
          - macOS 13 Ventura oder neuer
          NOTES
          gh release create "$TAG" build/PhotoFlow.dmg --title "PhotoFlow Build ${{ github.run_number }}" --notes-file notes.md --latest
          mkdir -p /tmp/dist && cp build/PhotoFlow.dmg /tmp/dist/ && cp build.log selftest-*.log qa.log icon-check.log icon-from-dmg.png /tmp/dist/ 2>/dev/null || true
          cd /tmp/dist
          git init -q -b dist
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "PhotoFlow build ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" dist

