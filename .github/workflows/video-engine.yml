name: video-engine

# Builds the PhotoFlow video model pack from the official Wan weights and runs real MLX inference on a GitHub Mac.
# GitHub's Macs are virtual machines: they prove the pipeline, not the speed or GPU behaviour of a real Mac.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: runner label
        default: macos-15
      model:
        description: "wan21-t2v-1.3b | wan22-ti2v-5b"
        default: wan21-t2v-1.3b
      width:
        default: '832'
      height:
        default: '480'
      frames:
        default: '17'
      steps:
        default: '12'
      device:
        description: "gpu | cpu | both"
        default: both
      publish_pack:
        description: upload the converted pack to release video-models-v1
        type: boolean
        default: false
      only_selftest:
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 350
    env:
      PACK: ${{ github.workspace }}/../pack
      OUT: ${{ github.workspace }}/../video-out
    steps:
      - uses: actions/checkout@v4

      - name: System
        run: |
          sw_vers; uname -m; sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu
          system_profiler SPDisplaysDataType | sed -n 1,25p
          df -h / | tail -1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Engine dependencies (exactly what the app installs)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Engine/video/requirements.txt
          python -m pip freeze | tee $RUNNER_TEMP/engine-freeze.txt

      - name: MLX self test
        run: |
          mkdir -p "$OUT"
          python -I Engine/video/pf_video_engine.py selftest | tee "$OUT/selftest.txt" || true

      - name: Download official weights
        if: ${{ !inputs.only_selftest }}
        run: |
          python -m pip install "huggingface_hub==0.26.2" "torch==2.5.1" "transformers==4.46.3" sentencepiece protobuf
          case "${{ inputs.model }}" in
            wan21-t2v-1.3b) REPO=Wan-AI/Wan2.1-T2V-1.3B ;;
            wan22-ti2v-5b)  REPO=Wan-AI/Wan2.2-TI2V-5B ;;
          esac
          echo "REPO=$REPO" >> $GITHUB_ENV
          python - "$REPO" <<'EOF'
          import sys, json
          from huggingface_hub import snapshot_download, HfApi
          repo = sys.argv[1]
          info = HfApi().model_info(repo)
          print("revision", info.sha)
          open("/tmp/revision.txt", "w").write(info.sha)
          snapshot_download(repo, revision=info.sha, local_dir="/tmp/wan-src", max_workers=8)
          EOF
          du -sh /tmp/wan-src; ls -la /tmp/wan-src /tmp/wan-src/google/umt5-xxl || true

      - name: Tokenizer equals the reference
        if: ${{ !inputs.only_selftest }}
        run: |
          python - <<'EOF'
          import sys
          sys.path.insert(0, "Engine/video")
          from pathlib import Path
          from transformers import AutoTokenizer
          import pf_video_engine as E
          ref = AutoTokenizer.from_pretrained("/tmp/wan-src/google/umt5-xxl")
          mine = E._LocalUMT5Tokenizer(Path("/tmp/wan-src/google/umt5-xxl"))
          for p in ["A red fox runs through fresh snow, cinematic.", "Ein schwarzer Sportwagen fährt bei Sonnenuntergang über eine Küstenstraße.",
                    "色调艳丽，过曝，静态，细节模糊不清", "x " * 600]:
              a = ref(p, max_length=512, padding="max_length", truncation=True, return_tensors="np")
              b = mine(p, max_length=512)
              same = (a["input_ids"] == b["input_ids"]).all() and (a["attention_mask"] == b["attention_mask"]).all()
              print("tokenizer", "OK" if same else "DIFF", int(a["attention_mask"].sum()), repr(p[:40]))
              assert same
          EOF

      - name: Convert to PhotoFlow pack (int8 text encoder)
        if: ${{ !inputs.only_selftest }}
        run: |
          /usr/bin/time -l python -I Engine/video/pf_convert.py --src /tmp/wan-src --tokenizer /tmp/wan-src/google/umt5-xxl \
            --out "$PACK" --t5-bits 8 --source-name "$REPO" --source-revision "$(cat /tmp/revision.txt)" 2>&1 | tail -40
          ls -la "$PACK"; du -sh "$PACK"
          rm -rf /tmp/wan-src
          cp "$PACK/pf_pack.json" "$OUT/"

      - name: Generate (GPU)
        if: ${{ !inputs.only_selftest && (inputs.device == 'gpu' || inputs.device == 'both') }}
        continue-on-error: true
        timeout-minutes: 150
        run: |
          cat > /tmp/job-gpu.json <<EOF
          {"model_dir": "$PACK", "prompt": "A red fox trotting through fresh snow in a quiet pine forest, soft morning light, realistic, cinematic",
           "width": ${{ inputs.width }}, "height": ${{ inputs.height }}, "num_frames": ${{ inputs.frames }}, "steps": ${{ inputs.steps }},
           "seed": 42, "out_dir": "$OUT/gpu", "device": "gpu"}
          EOF
          /usr/bin/time -l python -I Engine/video/pf_video_engine.py generate --job /tmp/job-gpu.json 2> "$OUT/gpu-stderr.txt" | tee "$OUT/gpu-events.txt"
          tail -30 "$OUT/gpu-stderr.txt"

      - name: Generate (CPU)
        if: ${{ !inputs.only_selftest && (inputs.device == 'cpu' || inputs.device == 'both') }}
        continue-on-error: true
        timeout-minutes: 180
        run: |
          cat > /tmp/job-cpu.json <<EOF
          {"model_dir": "$PACK", "prompt": "A red fox trotting through fresh snow in a quiet pine forest, soft morning light, realistic, cinematic",
           "width": ${{ inputs.width }}, "height": ${{ inputs.height }}, "num_frames": ${{ inputs.frames }}, "steps": ${{ inputs.steps }},
           "seed": 42, "out_dir": "$OUT/cpu", "device": "cpu"}
          EOF
          /usr/bin/time -l python -I Engine/video/pf_video_engine.py generate --job /tmp/job-cpu.json 2> "$OUT/cpu-stderr.txt" | tee "$OUT/cpu-events.txt"
          tail -30 "$OUT/cpu-stderr.txt"

      - name: Contact sheets
        if: always()
        run: |
          python - <<'EOF'
          import json, os, numpy as np
          from PIL import Image
          out = os.environ["OUT"]
          for dev in ("gpu", "cpu"):
              d = os.path.join(out, dev)
              meta = os.path.join(d, "meta.json")
              if not os.path.exists(meta):
                  continue
              m = json.load(open(meta)); t, h, w = m["frames"], m["height"], m["width"]
              v = np.fromfile(os.path.join(d, "frames.rgb"), dtype=np.uint8).reshape(t, h, w, 3)
              idx = np.linspace(0, t - 1, 6).round().astype(int)
              sheet = np.concatenate([np.concatenate([v[i] for i in idx[:3]], 1), np.concatenate([v[i] for i in idx[3:]], 1)], 0)
              Image.fromarray(sheet).save(os.path.join(out, f"{dev}-sheet.png"))
              frames = [Image.fromarray(f).resize((w // 2, h // 2)) for f in v]
              frames[0].save(os.path.join(out, f"{dev}.gif"), save_all=True, append_images=frames[1:], duration=1000 // m["fps"], loop=0)
              os.remove(os.path.join(d, "frames.rgb"))
              print(dev, m)
          EOF

      - name: Publish pack (release video-models-v1)
        if: ${{ inputs.publish_pack && !inputs.only_selftest }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view video-models-v1 >/dev/null 2>&1 || gh release create video-models-v1 --title "PhotoFlow video models v1" --notes "Video model packs converted from the official weights by .github/workflows/video-engine.yml. Licences: see THIRD_PARTY_LICENSES.md."
          cd "$PACK"
          tar -cf "/tmp/${{ inputs.model }}-tokenizer.tar" tokenizer
          for f in *.safetensors config.json pf_pack.json; do cp "$f" "/tmp/${{ inputs.model }}--$f"; done
          gh release upload video-models-v1 /tmp/${{ inputs.model }}--* "/tmp/${{ inputs.model }}-tokenizer.tar" --clobber

      - name: Publish results (branch video-results)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=$RUNNER_TEMP/vr; mkdir -p $D; cd $D
          git init -q -b video-results && git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git fetch -q origin video-results && git checkout -q origin/video-results -- . 2>/dev/null || true
          R="${{ inputs.model }}-$(uname -m)"; rm -rf "$R"; mkdir -p "$R"
          cp -r "$OUT"/* "$R"/ 2>/dev/null || true
          cp $RUNNER_TEMP/engine-freeze.txt "$R"/ 2>/dev/null || true
          find "$R" -name "*.rgb" -delete
          git add -A && git commit -q -m "video $R ${GITHUB_SHA::7}" && git push -f -q origin HEAD:video-results || true
